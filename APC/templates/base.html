<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Camping des Couverts{% endblock %}</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Ton CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="main-header">
        <nav class="navbar">
            <div class="logo">
                <a href="{{ url_for('index') }}">
                    <span class="icon">🏕️</span> Camping des Couverts
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="{{ url_for('index') }}">Accueil</a></li>
                <li><a href="{{ url_for('animation') }}">Animation</a></li>
                
                
                {% if session.get('user') %}
                    <li><a href="{{ url_for('logout') }}" class="btn-logout">Déconnexion</a></li>
                {% else %}
                    <li><a href="{{ url_for('login') }}" class="btn-login">Connexion</a></li>
                {% endif %}
            </ul>
        </nav>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; 2026 - <strong>Camping des Couverts</strong></p>
            <p class="sub-footer">Made by TheMaz</p>
        </div>
    </footer>
</body>
</html>
